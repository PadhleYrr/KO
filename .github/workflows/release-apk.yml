name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Decode Keystore
      env:
        ENCRYPTED_KEYSTORE: ${{ secrets.ENCRYPTED_KEYSTORE }}
        ENCRYPTED_KEYSTORE_PASSWORD: ${{ secrets.ENCRYPTED_KEYSTORE_PASSWORD }}
      run: |
        echo "$ENCRYPTED_KEYSTORE" | base64 --decode > app/keystore.jks
        chmod 600 app/keystore.jks

    - name: Build Release APK
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Psigning.keyId=$SIGNING_KEY_ALIAS \
          -Psigning.keySecret=$SIGNING_KEY_PASSWORD \
          -Psigning.storePassword=$SIGNING_STORE_PASSWORD \
          --stacktrace

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
